# .github/workflows/ci.yml
name: Pipeline DevSecOps - Ola mundo DevSecOps

on:
  push:
    branches: ["main"] # CI + Segurança + CD (Deploy)
  pull_request:
    branches: ["main"] # CI + Segurança (apenas teste)

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Permissão para fazer checkout do código
      packages: write # Permissão para FAZER PUSH de pacotes (imagem Docker)
      security-events: write # Relatórios de segurança
    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    - name: Instalar Dependencias
      run: npm install

    - name: Rodar testes
      run: npm test

    # SCA: falha o pipeline se houver vulnerabilidade HIGH ou CRITICAL nas dependências
    - name: Verificar vulnerabilidades de dependências (SCA)
      run: npm audit --audit-level=high

    - name: Configurar Docker Build
      uses: docker/setup-buildx-action@v3

    # Só roda se for um push na branch main
    - name: Logar no GitHub Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extrair Metadados do Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha
          latest

    # Constrói a imagem localmente no runner, SEM publicar
    - name: Build da Imagem Docker (preparação para scan)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        no-cache: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    # Scan com Trivy: falha o pipeline em HIGH/CRITICAL que tenham correção
    - name: Escanear vulnerabilidades com Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: "fs"
        scan-ref: "."
        scanners: "vuln"
        format: "table"
        exit-code: "1"
        severity: "HIGH,CRITICAL"
        ignore-unfixed: true

    # Só publica se for push na main E se o Trivy passou
    - name: Push da Imagem Docker para o GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy-to-local:
    # Este job SÓ RODA se for um push na 'main'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Precisa que o Job 1 (test-and-build, com as verificações de segurança) passe
    needs: test-and-build

    # Roda no seu PC (onde o runner está ouvindo)
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      # 1. Pega o código (para ter o docker-compose.yml)
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Loga no GHCR (para poder BAIXAR a imagem)
      - name: Logar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Executa o Deploy
      - name: Fazer Deploy com Docker Compose
        run: |
          docker compose pull
          docker compose up -d --no-build
          docker image prune -f
