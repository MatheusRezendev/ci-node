# .github/workflows/ci.yml
name: Pipeline de CI - Ola mundo DevOps

on:
  push: 
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Permissão para fazer checkout do código
      packages: write # Permissão para FAZER PUSH de pacotes (imagem Docker)
    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    - name: Instalar Dependencias
      run: npm install

    - name: Rodar testes
      run: npm test

    - name: Configurar Docker Build
      uses: docker/setup-buildx-action@v3

    # Só roda se for um push na branch main
    - name: Logar no GitHub Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Só roda se for um push na branch main
    - name: Extrair Metadados do Docker
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha
          latest

    - name: Build e Push da Imagem Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        # Só faz PUSH se for um push na branch main
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
